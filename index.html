<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARSCOPE</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body, #map { height: 100%; margin: 0; background: #1a0f0a; }
  .title { position: absolute; z-index: 1000; top: 10px; left: 50px;
    background: rgba(0,0,0,.7); color: #ff9966; padding: 6px 12px;
    border-radius: 8px; font: bold 16px sans-serif; }
  #note { position: absolute; z-index: 1000; top: 60px; left: 10px;
    max-width: 75%; display: none; background: rgba(0,0,0,.8); color: #fff;
    padding: 4px 8px; border-radius: 6px; font: 11px sans-serif; }
  #panel { position: absolute; z-index: 1000; left: 10px; right: 10px; bottom: 24px;
    max-height: 45%; overflow-y: auto;
    background: rgba(0,0,0,.85); color: #fff; padding: 10px 12px;
    border-radius: 10px; font: 14px sans-serif; }
  #panel button, .popup-btn { margin-top: 6px; padding: 6px 12px; border: 0;
    border-radius: 6px; background: #ff9966; font-weight: bold; }
  .small { font-size: 12px; opacity: .8; }
</style>
</head>
<body>
<div class="title">MARSCOPE</div>
<div id="note"></div>
<div id="map"></div>
<div id="panel"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ---------- Data layers (NASA Mars Trek) ----------
const T = "https://trek.nasa.gov/tiles/Mars/EQ/";
const tail = "/1.0.0/default/default028mm/{z}/{y}/{x}.jpg";
function trek(name, nz, attr) {
  return L.tileLayer(T + name + tail, { maxNativeZoom: nz, maxZoom: 14,
    noWrap: true, attribution: attr });
}
const viking = trek("Mars_Viking_MDIM21_ClrMosaic_global_232m", 7, "NASA/USGS Viking MDIM2.1");
const mola = trek("Mars_MGS_MOLA_ClrShade_merge_global_463m", 6, "NASA MGS MOLA");

const map = L.map("map", {
  crs: L.CRS.EPSG4326, minZoom: 0, maxZoom: 14,
  maxBounds: [[-90, -180], [90, 180]], layers: [viking]
});
map.fitBounds([[-90, -180], [90, 180]]);

const hazardGroup = L.layerGroup().addTo(map);
const poiGroup = L.layerGroup().addTo(map);

const layerCtl = L.control.layers(
  { "Imagery - Viking": viking, "Elevation - MOLA": mola },
  { "Hazard zones": hazardGroup, "Science targets": poiGroup }
).addTo(map);

// ---------- Load extra layers from NASA's own WMTS description ----------
const note = document.getElementById("note");
note.onclick = () => { note.style.display = "none"; };
function log(msg) {
  note.style.display = "block";
  note.innerHTML += msg + "<br>";
}

async function loadWmts(name, label, attr, fallbackTpl, fallbackZoom) {
  try {
    const r = await fetch(T + name + "/1.0.0/WMTSCapabilities.xml");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const xml = new DOMParser().parseFromString(await r.text(), "text/xml");
    const ru = xml.getElementsByTagName("ResourceURL")[0];
    const style = xml.getElementsByTagName("Style")[0]
      .getElementsByTagName("ows:Identifier")[0].textContent;
    let levels = 0, tms = "";
    Array.from(xml.getElementsByTagName("TileMatrixSet")).forEach(s => {
      if (!levels && s.getElementsByTagName("TileMatrix").length) {
        levels = s.getElementsByTagName("TileMatrix").length;
        tms = s.getElementsByTagName("ows:Identifier")[0].textContent;
      }
    });
    const tpl = ru.getAttribute("template").replace("http://", "https://")
      .replace("{Style}", style).replace("{TileMatrixSet}", tms)
      .replace("{TileMatrix}", "{z}").replace("{TileRow}", "{y}")
      .replace("{TileCol}", "{x}");
    layerCtl.addBaseLayer(L.tileLayer(tpl, { maxNativeZoom: levels - 1,
      maxZoom: 14, noWrap: true, attribution: attr }), label);
    log(label + ": OK (" + levels + " zoom levels)");
  } catch (e) {
    log(label + ": failed (" + e.message + ")");
    if (fallbackTpl) {
      layerCtl.addBaseLayer(L.tileLayer(fallbackTpl, { maxNativeZoom: fallbackZoom,
        maxZoom: 14, noWrap: true, attribution: attr }), label);
      log(label + ": using fallback");
    }
  }
}

const THEMIS = "Mars_MO_THEMIS-IR-Day_mosaic_global_100m_v12_clon0_ly";
loadWmts(THEMIS, "Thermal IR - THEMIS", "NASA Mars Odyssey THEMIS",
  T + THEMIS + "/1.0.0/default/default028mm/{z}/{y}/{x}.png", 9);
loadWmts("CTX_beta01_uncontrolled_5m_Caltech", "High-res - CTX (zoom in)",
  "NASA MRO CTX / Caltech");

// ---------- Hazard zones (approximate regional boxes) ----------
const zones = [
  { n: "Valles Marineris", b: [[-17, -90], [-2, -35]], sev: "HIGH",
    d: "Canyon system over 4,000 km long with very steep walls." },
  { n: "Olympus Mons", b: [[13.5, -139.5], [23.8, -128.2]], sev: "HIGH",
    d: "Giant volcano with a cliff-like escarpment around its base." },
  { n: "Tharsis volcanoes", b: [[-14, -125], [16, -99]], sev: "HIGH",
    d: "Arsia, Pavonis and Ascraeus Mons: long volcanic slopes and lava flows." },
  { n: "Hellas basin", b: [[-62, 45], [-23, 96]], sev: "MODERATE",
    d: "Huge, very deep impact basin with steep rim terrain." },
  { n: "Argyre basin", b: [[-65, -70], [-35, -15]], sev: "MODERATE",
    d: "Large impact basin with a rugged rim." },
  { n: "North polar region", b: [[80, -180], [90, 180]], sev: "HIGH",
    d: "Seasonal CO2 frost and ice, extreme cold." },
  { n: "South polar region", b: [[-90, -180], [-80, 180]], sev: "HIGH",
    d: "Seasonal CO2 frost and ice, extreme cold." }
];
zones.forEach(z => L.rectangle(z.b, {
  color: z.sev === "HIGH" ? "#ff5555" : "#ffcc44",
  weight: 1.5, fillOpacity: 0.15, interactive: false
}).addTo(hazardGroup));

function inZone(p, z) {
  return p.lat >= z.b[0][0] && p.lat <= z.b[1][0] &&
         p.lng >= z.b[0][1] && p.lng <= z.b[1][1];
}

function screenRoute(a, b) {
  const N = 100, hits = {}, order = [];
  for (let i = 0; i <= N; i++) {
    const p = { lat: a.lat + (b.lat - a.lat) * i / N,
                lng: a.lng + (b.lng - a.lng) * i / N };
    zones.forEach((z, k) => {
      if (inZone(p, z)) {
        if (!hits[k]) { hits[k] = 0; order.push(k); }
        hits[k]++;
      }
    });
  }
  return order.map(k => ({ z: zones[k], pct: hits[k] / (N + 1) * 100 }));
}

// ---------- Route planning ----------
const MARS_RADIUS_KM = 3389.5;
const routeGroup = L.layerGroup().addTo(map);
const panel = document.getElementById("panel");
const HINT = "Tap the map or a marker to set point A, then point B.<br>" +
  "<span class='small'>Red and yellow boxes are hazard zones.</span>";
let pts = [];

function distanceKm(a, b) {
  const r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const h = Math.sin(dLat / 2) ** 2 +
    Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * MARS_RADIUS_KM * Math.asin(Math.sqrt(h));
}

function addPoint(latlng) {
  if (pts.length >= 2) pts = [];
  pts.push(latlng);
  redraw();
}
function resetRoute() { pts = []; redraw(); }

function redraw() {
  routeGroup.clearLayers();
  pts.forEach((p, i) => {
    L.circleMarker(p, { radius: 8, color: i ? "#ff4444" : "#44ff88",
      fillOpacity: 1 })
      .bindTooltip(i ? "B" : "A", { permanent: true, direction: "top" })
      .addTo(routeGroup);
  });
  if (pts.length === 2) {
    L.polyline(pts, { color: "#ffffff", weight: 3, dashArray: "6 6" })
      .addTo(routeGroup);
    const d = distanceKm(pts[0], pts[1]);
    const found = screenRoute(pts[0], pts[1]);
    let score = 0;
    found.forEach(f => score += f.pct * (f.z.sev === "HIGH" ? 1 : 0.5));
    const level = score >= 25 ? "HIGH" : score >= 8 ? "MODERATE" : "LOW";
    const color = level === "HIGH" ? "#ff5555"
      : level === "MODERATE" ? "#ffcc44" : "#55dd88";
    let html = "<b>Route A \u2192 B</b><br>Straight-line distance: " +
      d.toFixed(0) + " km<br>Route hazard level: <b style='color:" + color +
      "'>" + level + "</b><br>";
    if (found.length) {
      html += "<br><b>Hazard zones crossed:</b><br>";
      found.forEach(f => {
        html += "\u2022 " + f.z.n + " (" + f.z.sev + "), " +
          f.pct.toFixed(0) + "% of route<br><span class='small'>" +
          f.z.d + "</span><br>";
      });
    } else {
      html += "<br>No mapped hazard zones crossed.<br>";
    }
    html += "<br><span class='small'>Regional screening only. Switch to the " +
      "High-res (CTX) layer and zoom in to inspect local terrain.</span><br>" +
      "<button id='rst'>Reset route</button>";
    panel.innerHTML = html;
  } else if (pts.length === 1) {
    panel.innerHTML = "Point A set. Tap the map to set point B.";
  } else {
    panel.innerHTML = HINT;
  }
  const b = document.getElementById("rst");
  if (b) b.onclick = resetRoute;
}

map.on("click", e => addPoint(e.latlng));

// ---------- Science targets ----------
const places = [
  { n: "Jezero Crater", p: [18.4, 77.7],
    d: "Perseverance landing site (2021). Ancient river delta: a prime place to search for signs of past life." },
  { n: "Gale Crater", p: [-5.4, 137.8],
    d: "Curiosity landing site (2012). Mount Sharp's layered rock records how the climate changed." },
  { n: "Meridiani Planum", p: [-1.95, -5.53],
    d: "Opportunity landing site (2004). Rich in hematite, a mineral that often forms in water." },
  { n: "Olympus Mons", p: [18.65, -133.8],
    d: "The largest volcano in the Solar System." },
  { n: "Valles Marineris", p: [-14, -59],
    d: "Canyon system over 4,000 km long; its walls expose layers of Mars' history." }
];
places.forEach(x => {
  const box = document.createElement("div");
  box.innerHTML = "<b>" + x.n + "</b><br>" + x.d + "<br>";
  const btn = document.createElement("button");
  btn.className = "popup-btn";
  btn.textContent = "Add to route";
  btn.onclick = () => { addPoint(L.latLng(x.p[0], x.p[1])); map.closePopup(); };
  box.appendChild(btn);
  L.marker(x.p).addTo(poiGroup).bindPopup(box);
});

redraw();
  // ---------- Layer guide ----------
const gbtn = document.createElement("button");
gbtn.textContent = "Layer guide";
gbtn.style.cssText = "position:absolute;z-index:1000;top:10px;left:176px;" +
  "padding:6px 10px;border:0;border-radius:8px;background:#ff9966;" +
  "font:bold 13px sans-serif";
document.body.appendChild(gbtn);

const gbox = document.createElement("div");
gbox.style.cssText = "position:absolute;z-index:1001;top:60px;left:10px;" +
  "right:10px;max-height:70%;overflow-y:auto;display:none;" +
  "background:rgba(0,0,0,.93);color:#fff;padding:12px;border-radius:10px;" +
  "font:13px sans-serif";
gbox.innerHTML =
  "<b>MARSCOPE combines 4 NASA missions</b><br><br>" +
  "<b>Imagery - Viking Orbiters</b> (232 m/px)<br>Global color context for " +
  "geology and surface features.<br><br>" +
  "<b>Elevation - Mars Global Surveyor / MOLA</b> (463 m/px)<br>Laser " +
  "altimeter map. Purple is low, white is high. Shows volcanoes, canyons " +
  "and basins.<br><br>" +
  "<b>Thermal IR - Mars Odyssey / THEMIS</b> (100 m/px)<br>Daytime " +
  "infrared brightness reflects surface temperature, which depends on the " +
  "material (rock vs. dust and sand).<br><br>" +
  "<b>High-res - Mars Reconnaissance Orbiter / CTX</b> (5 m/px)<br>Shows " +
  "craters, dunes, ridges and large obstacles in detail. Zoom in to plan " +
  "a walk.<br><br>" +
  "<b>Hazard zones</b><br>Approximate regional boxes (canyons, volcano " +
  "slopes, deep basins, polar ice) used to screen a route. Red is high " +
  "hazard, yellow is moderate.";
document.body.appendChild(gbox);
gbtn.onclick = () => {
  gbox.style.display = gbox.style.display === "none" ? "block" : "none";
};

// ---------- Destination briefing cards ----------
function showInCtx(ll) {
  const entry = layerCtl._layers.find(l => l.name.indexOf("High-res") === 0);
  if (entry) {
    layerCtl._layers.forEach(l => { if (!l.overlay) map.removeLayer(l.layer); });
    map.addLayer(entry.layer);
  }
  map.closePopup();
  map.flyTo(ll, 10);
}

poiGroup.clearLayers();
places.forEach(x => {
  const ll = L.latLng(x.p[0], x.p[1]);
  const here = zones.filter(z => inZone(ll, z))
    .map(z => z.n + " (" + z.sev + ")");
  const box = document.createElement("div");
  box.style.maxWidth = "230px";
  box.innerHTML = "<b>" + x.n + "</b><br>" + x.d +
    "<br><span class='small'>" + x.p[0] + "\u00B0, " + x.p[1] +
    "\u00B0</span><br>Hazard zones here: " +
    (here.length ? here.join(", ") : "none mapped") + "<br>";
  const b1 = document.createElement("button");
  b1.className = "popup-btn";
  b1.textContent = "Add to route";
  b1.onclick = () => { addPoint(ll); map.closePopup(); };
  const b2 = document.createElement("button");
  b2.className = "popup-btn";
  b2.style.marginLeft = "6px";
  b2.textContent = "View in CTX";
  b2.onclick = () => showInCtx(ll);
  box.appendChild(b1);
  box.appendChild(b2);
  L.marker(x.p).addTo(poiGroup).bindPopup(box);
});
// ---------- Safer route suggestion ----------
function segExposure(a, b) {
  const N = 60;
  let w = 0, inside = 0;
  for (let i = 0; i <= N; i++) {
    const p = { lat: a.lat + (b.lat - a.lat) * i / N,
                lng: a.lng + (b.lng - a.lng) * i / N };
    let m = 0;
    zones.forEach(z => {
      if (inZone(p, z)) m = Math.max(m, z.sev === "HIGH" ? 1 : 0.5);
    });
    w += m;
    if (m) inside++;
  }
  return { w: w / (N + 1), frac: inside / (N + 1) };
}

function pathStats(p) {
  let len = 0, cost = 0, inside = 0;
  for (let i = 1; i < p.length; i++) {
    const d = distanceKm(p[i - 1], p[i]);
    const e = segExposure(p[i - 1], p[i]);
    len += d;
    cost += d * (1 + 3 * e.w);
    inside += e.frac * d;
  }
  return { len: len, cost: cost, pct: len ? inside / len * 100 : 0 };
}

function findSaferRoute(a, b) {
  const direct = pathStats([a, b]);
  let best = null;
  const latMin = Math.max(-88, Math.min(a.lat, b.lat) - 25);
  const latMax = Math.min(88, Math.max(a.lat, b.lat) + 25);
  const lngMin = Math.max(-178, Math.min(a.lng, b.lng) - 40);
  const lngMax = Math.min(178, Math.max(a.lng, b.lng) + 40);
  for (let la = latMin; la <= latMax; la += 3) {
    for (let ln = lngMin; ln <= lngMax; ln += 3) {
      const w = L.latLng(la, ln);
      const s = pathStats([a, w, b]);
      if (!best || s.cost < best.cost) best = { wp: w, len: s.len,
        cost: s.cost, pct: s.pct };
    }
  }
  return { direct: direct, best: best };
}

const redrawBase2 = redraw;
redraw = function () {
  redrawBase2();
  if (pts.length !== 2) return;
  const r = findSaferRoute(pts[0], pts[1]);
  const box = document.createElement("div");
  if (r.best && r.best.cost < r.direct.cost * 0.9 && r.best.pct < r.direct.pct) {
    L.polyline([pts[0], r.best.wp, pts[1]],
      { color: "#55dd88", weight: 3 }).addTo(routeGroup);
    const extra = (r.best.len / r.direct.len - 1) * 100;
    box.innerHTML = "<b style='color:#55dd88'>Suggested safer route (green)</b><br>" +
      r.best.len.toFixed(0) + " km (" + (extra >= 0 ? "+" : "") +
      extra.toFixed(0) + "% longer)<br>Share of route inside hazard zones: " +
      r.direct.pct.toFixed(0) + "% \u2192 " + r.best.pct.toFixed(0) + "%<br><br>";
  } else {
    box.innerHTML = "<b>Safer route:</b> the direct route is already close " +
      "to the safest option.<br><br>";
  }
  panel.insertBefore(box, document.getElementById("rst"));
};
// ---------- Marswalk mode (routes under 50 km) ----------
const redrawBase3 = redraw;
redraw = function () {
  redrawBase3();
  if (pts.length !== 2) return;
  const a = pts[0], b = pts[1];
  const d = distanceKm(a, b);
  if (d > 50) return;
  const speed = 3, win = 8;
  const rt = d / speed * 2;
  const box = document.createElement("div");
  box.innerHTML = "<b>Marswalk estimate</b><br>Distance: " + d.toFixed(2) +
    " km one way<br>Round trip at " + speed + " km/h: " + rt.toFixed(1) +
    " h (" + (rt / win * 100).toFixed(0) + "% of an assumed " + win +
    " h EVA window)<br><span class='small'>Assumed walking speed and EVA " +
    "window. Real values depend on the suit, terrain and mission rules. " +
    "Check rocks, slopes and dunes in CTX imagery.</span><br>";
  const btn = document.createElement("button");
  btn.textContent = "View route in CTX";
  btn.onclick = () => {
    const e = layerCtl._layers.find(l => l.name.indexOf("High-res") === 0);
    if (e) {
      layerCtl._layers.forEach(l => { if (!l.overlay) map.removeLayer(l.layer); });
      map.addLayer(e.layer);
    }
    map.fitBounds(L.latLngBounds(a, b).pad(0.3));
  };
  box.appendChild(btn);
  box.appendChild(document.createElement("br"));
  box.appendChild(document.createElement("br"));
  panel.insertBefore(box, document.getElementById("rst"));
};
// ---------- Short routes: show one decimal ----------
const redrawBase4 = redraw;
redraw = function () {
  redrawBase4();
  if (pts.length !== 2) return;
  const d = distanceKm(pts[0], pts[1]);
  if (d >= 50) return;
  const w = document.createTreeWalker(panel, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = w.nextNode())) {
    if (n.nodeValue.indexOf("Straight-line distance: ") === 0) {
      n.nodeValue = "Straight-line distance: " + d.toFixed(1) + " km";
    }
  }
};

</script>
</body>
</html>
